name: Probar y publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas de datos y de la lógica de Code.gs
        run: npm test
      - name: Sintaxis de los scripts del sitio
        run: for f in js/*.js; do node --check "$f"; done

  publicar:
    needs: probar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio (solo lo que el navegador necesita)
        run: |
          mkdir -p _site/data
          cp -r index.html css js assets _site/
          cp data/simulacro.data.js _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
